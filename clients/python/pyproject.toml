[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "souq-mcp"
version = "0.3.0"
description = "Official 1-line MCP client & Python SDK for SOUQ autonomous micro-services (x402 Base USDC + Prepaid API Keys)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "SOUQ Autonomous Commerce Swarm", email = "dev@souq-swarm.ai" }
]
keywords = ["mcp", "model-context-protocol", "ai-agents", "llm", "token-compression", "crypto-arbitrage", "base-l2", "x402"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://written-emera-arapython-bf7436a4.apps.mistral.run"
Repository = "https://github.com/MahmoudSamour/souq-commerce-swarm"

[project.optional-dependencies]
wallet = [
    "web3>=6.0.0",
    "eth-account>=0.8.0"
]

[project.scripts]
souq-mcp = "souq_mcp.cli:main"
souq = "souq_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["souq_mcp"]
